name: Update investor radar data

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data
        run: |
          python scripts/update_data.py
          python scripts/research_contacts.py

      - name: Commit changes
        run: |
          if [[ -z "$(git status --porcelain data/site-data.json data/source-status.json data/contact-research.json data/contact-research.csv CONTACT_RESEARCH.md)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json data/source-status.json data/contact-research.json data/contact-research.csv CONTACT_RESEARCH.md
          git commit -m "chore: refresh investor radar data"
          git push
